[project]
name = "download-yt-local-web-backend"
version = "0.0.0"
requires-python = "==3.12.*"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
strict = true
files = ["app", "tests", "scripts/update_yt_dlp.py"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true
